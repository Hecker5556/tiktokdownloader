[build-system]
requires = [
    "setuptools>=61.0",
    "pip>=22.3"
]
build-backend = "setuptools.build_meta"

[project]
name = "tiktokdownloader"
version = "0.1.2"
description = "Download posts from Tiktok"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
"urllib3",
"aiofiles",
"curl_cffi",
]

[project.scripts]
tiktokdownloader = "tiktokdownloader.tiktokdownloader:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiktokdownloader*"]