[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktokdownloader"
version = "0.1.0"
description = "Download posts from Tiktok"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
"aiohttp==3.11.11",
"urllib3",
"aiohttp_socks",
"aiofiles",
]